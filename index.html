<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a18">
<link rel="manifest" href="owner.webmanifest">
<link rel="apple-touch-icon" href="chef-192.png">
<title>مطعمي · آيفورو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap">
<style>
  /* The owner's page: his restaurant now, from anywhere. Light glass cards, faintly violet, on a dark ground; each card's result at its foot. */
  :root { --v: #6a55e8; --ink: #14234d; --soft: #5d6b8f; --line: rgba(106, 85, 232, .12); --ok: #0f9d6b; --bad: #d9364f; --on-dark: #f2f1ff; --on-dark-soft: #aeb0d0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: #0d0b1c; }
  body { margin: 0; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; color: var(--ink); min-height: 100dvh; }
  /* The dark ground with a soft violet light behind the glass: fixed, so it stays put while the cards slide over it. */
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: radial-gradient(70% 45% at 85% 0%, rgba(124, 92, 255, .45), transparent 70%), radial-gradient(60% 40% at 0% 60%, rgba(124, 92, 255, .22), transparent 70%), #0d0b1c; }
  main { max-width: 760px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom)); }
  header.page { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 4px 14px; color: var(--on-dark); }
  h1 { margin: 0; font-size: 24px; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--on-dark-soft); }
  .live i { width: 10px; height: 10px; border-radius: 50%; background: #5d6380; }
  .live.on i { background: #3ddc97; box-shadow: 0 0 0 4px rgba(61, 220, 151, .22); }
  .card { background: linear-gradient(160deg, rgba(255, 255, 255, .93), rgba(240, 236, 255, .86)); border: 1px solid rgba(255, 255, 255, .7); border-radius: 26px; margin-top: 14px; overflow: hidden; -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); box-shadow: 0 18px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .9); }
  .card h2 { margin: 0; padding: 18px 20px 4px; font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .card h2 i { font-style: normal; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(106, 85, 232, .1); font-size: 19px; }
  .card .note { padding: 0 20px; font-size: 14px; color: var(--soft); }
  .body { padding: 6px 20px 14px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 20px; background: rgba(106, 85, 232, .08); border-top: 1px solid var(--line); }
  .total > span { font-size: 16px; font-weight: 600; color: var(--soft); }
  .total b { font-size: 26px; color: var(--v); white-space: nowrap; }
  .total.ok { background: rgba(15, 157, 107, .09); } .total.ok b { color: var(--ok); }
  .total.bad { background: rgba(217, 54, 79, .09); } .total.bad b { color: var(--bad); }
  .total small { font-size: 15px; font-weight: 600; }
  .big { font-size: 46px; font-weight: 700; line-height: 1.1; padding: 4px 20px 0; }
  .big small { font-size: 18px; color: var(--soft); font-weight: 600; }
  .trend { display: inline-block; margin: 8px 20px 0; padding: 4px 10px; border-radius: 99px; font-size: 14px; font-weight: 700; }
  .trend.up { background: rgba(15, 157, 107, .12); color: var(--ok); } .trend.down { background: rgba(217, 54, 79, .1); color: var(--bad); }
  .alerts { background: linear-gradient(160deg, rgba(255, 244, 246, .95), rgba(255, 228, 234, .88)); border: 2px solid #f5c2cb; }
  .alerts h2 { color: var(--bad); }
  .alerts h2 i { background: #ffdde3; }
  .alerts li { margin: 8px 0; font-size: 16px; line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 17px; }
  .rows li:last-child { border-bottom: 0; }
  .rows b { font-weight: 700; white-space: nowrap; }
  .rows small { display: block; font-size: 13px; color: var(--soft); margin-top: 2px; }
  .rows li.bad, .rows li.bad b { color: var(--bad); }
  .rows b.out { color: var(--bad); }
  .rows li.off { color: #9aa3bd; }
  .tag { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(93, 107, 143, .1); color: var(--soft); white-space: nowrap; }
  .tag.bad { background: #ffe3e8; color: var(--bad); } .tag.ok { background: #dff5ec; color: var(--ok); }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 8px 20px 16px; }
  .trio div { background: rgba(255, 255, 255, .7); border: 1px solid var(--line); border-radius: 18px; padding: 12px 6px; text-align: center; }
  .trio b { display: block; font-size: 26px; line-height: 1.2; }
  .trio span { font-size: 13px; color: var(--soft); font-weight: 600; }
  .trio .bad b { color: var(--bad); }
  details summary { cursor: pointer; list-style: none; text-align: center; color: var(--v); font-weight: 700; font-size: 15px; padding: 10px 0 2px; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { display: none; }
  .num { direction: ltr; unicode-bidi: isolate; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; margin: 6px 20px 14px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .bar i { width: 100%; border-radius: 10px 10px 4px 4px; background: #d9d3fb; min-height: 4px; }
  .bar.today i { background: var(--v); }
  .bar span { font-size: 12px; color: var(--soft); }
  .empty { color: var(--soft); font-size: 16px; padding: 8px 0; }
  .gate { text-align: center; padding-top: 12vh; color: var(--on-dark); }
  .gate img { width: 84px; }
  .gate h1 { font-size: 28px; margin-top: 12px; }
  .gate p { color: var(--on-dark-soft); font-size: 16px; line-height: 1.6; }
  input { width: 100%; font: 700 22px 'Readex Pro', sans-serif; text-align: center; letter-spacing: 2px; direction: ltr; padding: 16px; border-radius: 18px; border: 2px solid rgba(255, 255, 255, .7); background: rgba(246, 243, 255, .92); color: var(--ink); text-transform: uppercase; }
  input:focus { outline: none; border-color: #9c8cff; }
  button { font: 700 19px 'Readex Pro', sans-serif; border: 0; border-radius: 18px; padding: 16px; width: 100%; margin-top: 12px; background: var(--v); color: #fff; touch-action: manipulation; }
  button:active { transform: scale(.98); }
  button.quiet { background: transparent; color: var(--on-dark-soft); font-size: 15px; font-weight: 600; }
  .error { color: #ff8094; min-height: 24px; margin-top: 10px; }
  .wait { text-align: center; color: var(--on-dark-soft); padding: 40px 0; font-size: 17px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// The summary the restaurant's main machine leaves every minute on two public relays, sealed with the owner's code
// (src/main/owner.ts). Read here over MQTT on a secure web socket, opened with the same code, never sent anywhere.
const RELAYS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt']
const $ = (id) => document.getElementById(id)
const iqd = (n) => Math.round(n || 0).toLocaleString('en-US')
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const clean = (code) => code.replace(/[^A-Za-z0-9]/g, '').toUpperCase()
const stored = { get: () => { try { return localStorage.getItem('aivoro-owner') || '' } catch { return '' } }, set: (v) => { try { v ? localStorage.setItem('aivoro-owner', v) : localStorage.removeItem('aivoro-owner') } catch {} } }

// ---- the code: the room's name and the key are both made from it
async function open(code) {
  const enc = new TextEncoder()
  const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('owner:' + clean(code))))
  const topic = 'aivoro/owner/' + [...hash].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 24)
  const base = await crypto.subtle.importKey('raw', enc.encode(clean(code)), 'PBKDF2', false, ['deriveKey'])
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('aivoro-owner'), iterations: 120000 }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
  return { topic, key }
}
async function unseal(key, bytes) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12))
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()
  return JSON.parse(text)
}

// ---- the relays' language (MQTT 3.1.1 on a web socket), only what listening needs
const str = (s) => { const b = new TextEncoder().encode(s); return [b.length >> 8, b.length & 255, ...b] }
const pkt = (kind, body) => { const len = []; let n = body.length; do { let d = n % 128; n = Math.floor(n / 128); len.push(n > 0 ? d | 128 : d) } while (n > 0); return new Uint8Array([kind, ...len, ...body]) }
function listen(url, topic, onMessage) {
  let ws, ping
  const start = () => {
    ws = new WebSocket(url, 'mqtt')
    ws.binaryType = 'arraybuffer'
    let buffer = new Uint8Array(0)
    ws.onopen = () => {
      ws.send(pkt(0x10, [...str('MQTT'), 4, 2, 0, 60, ...str('owner-' + Math.random().toString(36).slice(2, 10))]))
      ws.send(pkt(0x82, [0, 1, ...str(topic), 0]))
      ping = setInterval(() => ws.readyState === 1 && ws.send(new Uint8Array([0xc0, 0])), 45000)
    }
    ws.onmessage = (event) => {
      const chunk = new Uint8Array(event.data)
      const joined = new Uint8Array(buffer.length + chunk.length); joined.set(buffer); joined.set(chunk, buffer.length); buffer = joined
      for (;;) {
        let len = 0, shift = 0, i = 1, d
        do { if (i >= buffer.length) return; d = buffer[i++]; len |= (d & 127) << shift; shift += 7 } while (d & 128)
        if (buffer.length < i + len) return
        const kind = buffer[0], body = buffer.slice(i, i + len)
        buffer = buffer.slice(i + len)
        if ((kind & 0xf0) === 0x30) { const tl = (body[0] << 8) | body[1]; onMessage(body.slice(2 + tl + ((kind & 6) ? 2 : 0))) }
      }
    }
    ws.onclose = () => { clearInterval(ping); setTimeout(start, 5000) }
  }
  start()
}

// ---- what the page says
const FLAGS = {
  VOIDS: (f) => `${f.n} ألغى ${f.x} مرات بعد الإرسال للمطبخ، أكثر من ضعف الباقين.`,
  DISCOUNTS: (f) => `${f.n} منح ${f.x} خصومات، أكثر من ضعف الباقين.`,
  HOSPITALITY: (f) => `${f.n} سجّل ${f.x} ضيافات، أكثر من ضعف الباقين.`,
  DRAWER: (f) => `${f.n} فتح الدرج ${f.x} مرات بلا بيع.`,
  REPRINT: (f) => `${f.n} أعاد طباعة فواتير مدفوعة ${f.x} مرات.`,
  REFUSED: (f) => `${f.n} أدخل كلمة مرور المدير خطأً ${f.x} مرات.`,
  EXPENSES: (f) => `${f.n} عُدّلت أو حُذفت مصاريفه ${f.x} مرات.`,
  SHORT: (f) => `درج ${f.n} نقص ${iqd(f.x)} د.ع.`,
}
const DOWN = { net: 'الحاسبة الرئيسية بلا شبكة', printer: 'طابعة لا تعمل', phone: 'هاتف الطلبات منقطع', station: 'حاسبة كاشير منقطعة', screen: 'شاشة منقطعة', internet: 'لا إنترنت في المطعم', backup: 'النسخ الاحتياطي' }
const DAYS = ['أحد', 'اثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت']
let last = null

function gate(error = '') {
  $('app').innerHTML = `<div class="gate"><img src="chef-192.png" alt=""><h1>مطعمي</h1>
    <p>اكتب رمز صاحب المطعم.<br>تجده في البرنامج: مكتب المدير ← التطبيقات ← صفحة صاحب المطعم.</p>
    <input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
    <button id="go">افتح</button><div class="error">${esc(error)}</div></div>`
  $('go').onclick = () => { const c = $('code').value; if (clean(c).length !== 12) return gate('الرمز 12 حرفاً ورقماً.'); stored.set(c); start(c) }
  $('code').onkeydown = (e) => { if (e.key === 'Enter') $('go').click() }
}

const TYPES = { dinein: 'صالة', takeaway: 'سفري', delivery: 'توصيل' }
const ACTS = { order_voided: 'ألغى الفاتورة', line_voided: 'ألغى صنفاً من الفاتورة', discount: 'خصم على الفاتورة', hospitality: 'ضيافة على الفاتورة', order_refunded: 'أرجع الفاتورة', line_refunded: 'أرجع صنفاً من الفاتورة' }
const UNITS = { g: ['غم', 'كغم'], ml: ['مل', 'لتر'], piece: ['قطعة', 'قطعة'] }
const qty = (q, u) => { const [small, large] = UNITS[u] || ['', '']; return u !== 'piece' && Math.abs(q) >= 1000 ? `${+(q / 1000).toFixed(1)} ${large}` : `${Math.round(q)} ${small}` }
const clock = (iso) => new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
const money = (n) => `<span class="num">${iqd(n)}</span> <small>د.ع</small>`
const card = (icon, title, body, total = '', cls = '', note = '') => `<section class="card ${cls}"><h2><i>${icon}</i>${title}</h2>${note ? `<p class="note">${note}</p>` : ''}${body}${total}</section>`
const foot = (label, value, tone = '') => `<div class="total ${tone}"><span>${label}</span><b>${value}</b></div>`
const rows = (items, empty) => `<div class="body"><ul class="rows">${items.length ? items.join('') : `<li class="empty">${empty}</li>`}</ul></div>`
// A long list shows its first rows; the rest wait behind one press, and stay open across the minute's refresh.
const more = (key, items, empty, first = 8) =>
  items.length <= first + 2 ? rows(items, empty) : `<div class="body"><ul class="rows">${items.slice(0, first).join('')}</ul><details data-k="${key}"><summary>عرض الكل (${items.length})</summary><ul class="rows">${items.slice(first).join('')}</ul></details></div>`

function render(s) {
  if (s.v < 2) return ($('app').innerHTML = '<div class="wait">حدّث برنامج آيفورو في المطعم لتظهر هذه الصفحة كاملة.</div>')
  const opened = [...document.querySelectorAll('details[open]')].map((x) => x.dataset.k)
  const d = s.day, n = s.now
  const ago = Math.max(0, Math.round((Date.now() - Date.parse(s.at)) / 60000))
  const alerts = [...s.flags.map((f) => (FLAGS[f.c] || (() => ''))(f)), ...s.down.map((r) => `${DOWN[r.k] || 'جهاز لا يعمل'}${r.n ? ': ' + r.n : ''}`)].filter(Boolean)
  if (ago >= 3) alerts.unshift(`البرنامج لا يرسل منذ ${ago} دقيقة: الحاسبة الرئيسية مطفأة أو بلا إنترنت. الأرقام أدناه آخر ما وصل.`)
  const change = d.prev > 0 ? Math.round(((d.sales - d.prev) / d.prev) * 100) : null
  const present = s.staff.filter((p) => p.k === 'present'), lateStaff = present.filter((p) => p.l > 0)
  const shortLast = s.cash.last && s.cash.last.d !== 0
  const lows = s.stock.items.filter((m) => m.low)
  const max = Math.max(1, ...s.sales.bars.map((w) => w.s))
  const m = s.month

  $('app').innerHTML = `
    <header class="page"><h1>${esc(s.name || 'مطعمي')}</h1><span class="live ${ago < 3 ? 'on' : ''}"><i></i>${ago < 1 ? 'الآن' : `قبل ${ago} د`}</span></header>

    ${alerts.length ? card('⚠️', 'انتبه', `<div class="body"><ul>${alerts.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>`, '', 'alerts') : ''}

    ${card('💰', 'مبيعات اليوم',
      `<div class="big">${money(d.sales)}</div>${change === null ? '' : `<span class="trend ${change >= 0 ? 'up' : 'down'}">${change >= 0 ? '▲' : '▼'} ${Math.abs(change)}% عن نفس اليوم من الأسبوع الماضي</span>`}
      ${rows([
        `<li><span>نقد</span><b class="num">${iqd(d.cash)}</b></li>`,
        `<li><span>بطاقة</span><b class="num">${iqd(d.card)}</b></li>`,
        ...(d.usd ? [`<li><span>دولار (بالدينار)</span><b class="num">${iqd(d.usd)}</b></li>`] : []),
        ...(d.debt ? [`<li><span>آجل على الزبائن</span><b class="num">${iqd(d.debt)}</b></li>`] : []),
        `<li><span>صالة · سفري · توصيل</span><b class="num">${iqd(d.dinein)} · ${iqd(d.takeaway)} · ${iqd(d.delivery)}</b></li>`
      ], '')}`,
      foot(`${d.orders} طلب${d.orders ? ` · المعدل ${iqd(d.sales / d.orders)} د.ع` : ''}`, money(d.sales)))}

    ${card('🍽️', 'الطلبات الآن',
      `<div class="trio"><div><b>${n.open}</b><span>مفتوحة</span></div><div class="${n.late.length ? 'bad' : ''}"><b>${n.cooking}</b><span>في المطبخ</span></div><div><b>${n.out}</b><span>مع السائقين</span></div></div>
      ${n.late.length ? more('late', n.late.map((o) => `<li class="bad"><span>طلب ${o.n} · ${TYPES[o.t] || ''}</span><b>متأخر ${o.m} د</b></li>`), '', 5) : ''}`,
      n.late.length ? foot('طلبات متأخرة', n.late.length, 'bad') : foot('طلبات متأخرة', 'لا يوجد', 'ok'))}

    ${card('🧾', 'الصندوق',
      rows([
        ...s.cash.open.map((c) => `<li><span>درج ${esc(c.n)}<small>مفتوح الآن · يجب أن يكون فيه</small></span><b class="num">${iqd(c.x)}</b></li>`),
        ...(s.cash.last ? [`<li class="${shortLast ? 'bad' : ''}"><span>آخر إغلاق: ${esc(s.cash.last.n)}<small>${clock(s.cash.last.at)}</small></span><b>${s.cash.last.d === 0 ? 'مطابق' : `${s.cash.last.d < 0 ? 'نقص' : 'زيادة'} <span class="num">${iqd(Math.abs(s.cash.last.d))}</span>`}</b></li>`] : []),
        `<li><span>الخزنة</span><b class="num">${iqd(s.cash.safe)}</b></li>`
      ], 'لا درج مفتوح'),
      foot('النقد في الأدراج الآن', money(s.cash.open.reduce((a, c) => a + c.x, 0)), shortLast ? 'bad' : ''))}

    ${card('✂️', 'الإلغاءات والخصومات والضيافة',
      more('watch', s.watch.map((w) => `<li class="${w.a.includes('void') || w.a.includes('refund') ? 'bad' : ''}"><span>${esc(w.n)}: ${ACTS[w.a] || w.a} ${esc(w.o)}${w.d ? `<small>${esc(w.d)}</small>` : ''}</span><b class="num">${clock(w.at)}</b></li>`), 'لا شيء اليوم', 6),
      foot(`خصومات ${iqd(s.sums.discounts)} · ضيافة ${iqd(s.sums.hospitality)}`, `${s.sums.voids} ملغاة`, s.sums.voids ? 'bad' : 'ok'))}

    ${card('👥', 'الموظفون والحضور',
      more('staff', s.staff
        .sort((a, b) => (b.l > 0) - (a.l > 0) || (a.k === 'present' ? 0 : 1) - (b.k === 'present' ? 0 : 1))
        .map((p) => p.k === 'present'
          ? `<li class="${p.l > 0 ? 'bad' : ''}"><span>${esc(p.n)}<small>دخل <span class="num">${esc(p.in)}</span>${p.out ? ` · خرج <span class="num">${esc(p.out)}</span>` : ''}${p.st ? ` · دوامه <span class="num">${esc(p.st)}</span>` : ''}</small></span>${p.l > 0 ? `<span class="tag bad">متأخر ${p.l} د</span>` : '<span class="tag ok">حاضر</span>'}</li>`
          : `<li class="off"><span>${esc(p.n)}${p.st ? `<small>دوامه <span class="num">${esc(p.st)}</span></small>` : ''}</span><span class="tag">${p.k === 'leave' ? 'إجازة' : p.k === 'absent' ? 'غائب' : 'لم يحضر بعد'}</span></li>`), 'لا موظفين'),
      foot(`حاضر ${present.length} من ${s.staff.length}`, lateStaff.length ? `${lateStaff.length} متأخر` : 'لا متأخرين', lateStaff.length ? 'bad' : 'ok'))}

    ${s.drivers.length ? card('🛵', 'السائقون',
      rows(s.drivers.map((r) => `<li><span>${esc(r.n)}<small>وصّل اليوم ${r.done} · معه الآن ${r.out}</small></span><b class="num">${iqd(r.due)}</b></li>`), ''),
      foot('مال عند السائقين لم يُسلَّم', money(s.drivers.reduce((a, r) => a + r.due, 0))), '', 'المبلغ بجانب كل سائق: ما يجب أن يسلّمه للصندوق.') : ''}

    ${card('📦', 'المخزن',
      more('stock', [...lows, ...s.stock.items.filter((x) => !x.low)].map((x) => `<li class="${x.low ? 'bad' : ''}"><span>${esc(x.n)}<small>${x.low ? 'قارب على النفاد · ' : ''}قيمته <span class="num">${iqd(x.v)}</span> د.ع</small></span><b>${qty(x.q, x.u)}</b></li>`), 'لا مواد مسجّلة'),
      foot(`قيمة المخزن كله${lows.length ? ` · ${lows.length} قاربت على النفاد` : ''}`, money(s.stock.value), lows.length ? 'bad' : ''))}

    ${card('🛒', 'أمر الشراء لباجر',
      more('buy', s.buy.lines.map((l) => `<li><span>${esc(l.n)}<small>${l.q} ${esc(l.u)}${l.s ? ` · من ${esc(l.s)}` : ''}</small></span><b class="num">${l.p === null ? '—' : iqd(l.p)}</b></li>`), 'لا يحتاج المطعم شراء شيء الآن'),
      foot('المبلغ المتوقع دفعه تقريباً', money(s.buy.total)))}

    ${card('📈', 'المبيعات',
      `${rows([`<li><span>اليوم</span><b class="num">${iqd(s.sales.day)}</b></li>`, `<li><span>آخر 7 أيام</span><b class="num">${iqd(s.sales.week)}</b></li>`, `<li><span>هذا الشهر</span><b class="num">${iqd(s.sales.month)}</b></li>`], '')}
      <div class="bars">${s.sales.bars.map((w, i) => `<div class="bar ${i === s.sales.bars.length - 1 ? 'today' : ''}"><i style="height:${Math.round((w.s / max) * 100)}%"></i><span>${DAYS[new Date(w.d + 'T12:00').getDay()]}</span></div>`).join('')}</div>`,
      foot('مبيعات الشهر حتى اليوم', money(s.sales.month)))}

    ${card('🧮', 'حساب الشهر',
      rows([
        `<li><span>المبيعات</span><b class="num">${iqd(m.sales)}</b></li>`,
        `<li><span>كلفة المواد</span><b class="num out">${iqd(m.cost)}</b></li>`,
        `<li><span>الرواتب</span><b class="num out">${iqd(m.wages)}</b></li>`,
        `<li><span>الإيجار والمصاريف الثابتة</span><b class="num out">${iqd(m.fixed)}</b></li>`,
        `<li><span>مصاريف التشغيل المسجّلة</span><b class="num out">${iqd(m.running)}</b></li>`
      ], ''),
      foot('صافي الربح المتوقع', money(m.profit), m.profit >= 0 ? 'ok' : 'bad'), '', 'تقديري: الرواتب والمصاريف الثابتة لشهر كامل، والمبيعات حتى اليوم.')}

    ${card('📒', 'الديون',
      rows([
        `<li><span>على الزبائن للمطعم</span><b class="num">${iqd(s.debts.customers)}</b></li>`,
        `<li><span>على المطعم للموردين</span><b class="num">${iqd(s.debts.suppliers)}</b></li>`
      ], ''),
      foot(s.debts.customers >= s.debts.suppliers ? 'الفرق لصالح المطعم' : 'الفرق على المطعم', money(Math.abs(s.debts.customers - s.debts.suppliers)), s.debts.customers >= s.debts.suppliers ? 'ok' : 'bad'))}

    <button class="quiet" id="out">تغيير الرمز</button>`
  for (const k of opened) document.querySelector(`details[data-k="${k}"]`)?.setAttribute('open', '')
  $('out').onclick = () => (stored.set(''), location.reload())
}

async function start(code) {
  if (!window.crypto?.subtle || !window.DecompressionStream) return gate('افتح الصفحة من رابطها الآمن (https) وبمتصفح حديث.')
  $('app').innerHTML = '<div class="wait">أتصل بالمطعم…</div>'
  const { topic, key } = await open(code)
  let any = false
  setTimeout(() => !any && ($('app').innerHTML = '<div class="wait">لم يصل شيء بعد. تأكد من الرمز، وأن «صفحة صاحب المطعم» مفعّلة في البرنامج والحاسبة الرئيسية تعمل وعليها إنترنت.<br><br><button class="quiet" onclick="localStorage.removeItem(\'aivoro-owner\');location.reload()">تغيير الرمز</button></div>'), 15000)
  for (const url of RELAYS)
    listen(url, topic, async (bytes) => {
      try {
        const s = await unseal(key, bytes)
        if (last && Date.parse(s.at) < Date.parse(last.at)) return
        any = true
        last = s
        render(s)
      } catch {}
    })
  // The age shown keeps counting between messages.
  setInterval(() => last && render(last), 30000)
}

// Opened from the square code in the program: the code comes in the link, is kept, and leaves the address bar.
const given = new URLSearchParams(location.hash.slice(1)).get('c')
if (given) (stored.set(given), history.replaceState(null, '', location.pathname))
const saved = stored.get()
saved ? start(saved) : gate()
</script>
